[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow — task management API (FastAPI, Clean-ish Architecture, modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "openai>=1.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "polyfactory>=2.18",
    "freezegun>=1.5",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "types-passlib>=1.7",
    "types-python-jose>=3.3",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Один event loop на всю сессию тестов — и для фикстур, и для самих тестов
# (в pytest-asyncio 1.x это два разных ключа; несовпадение scope между ними
# даёт `RuntimeError: ... attached to a different loop`, если async-фикстура
# уровня session открывает соединение, а тест запускается в отдельном
# per-function loop). Иначе module-level asyncpg connection pool в
# conftest.py создаётся в одном loop, а переиспользуется в другом между
# тестами. Поймано реальным прогоном repository-тестов.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
