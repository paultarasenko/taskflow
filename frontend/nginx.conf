server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь без совпадающего файла отдаёт index.html — React Router
    # сам разбирает маршрут на клиенте (иначе прямой заход на /projects/123
    # вернёт 404 от nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # У Vite хэш в имени файла ассетов — можно кэшировать агрессивно и долго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
