name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres нужен реально: Этап 4 добавил repository/alembic/connection
    # тесты, которые бьют в настоящую БД, а не моки. Redis — Этап 8
    # добавил WebSocket-тесты с реальным Pub/Sub. Без обоих сервисов здесь
    # `pytest` упадёт на CI ровно так же, как упал бы без Docker locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@localhost:5432/taskflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create test databases
        # tests/conftest.py и tests/test_alembic_migrations.py используют
        # отдельные БД (taskflow_test, taskflow_migrations_test) — см.
        # обоснование прямо в этих файлах (create_all vs alembic upgrade
        # не должны конкурировать за одну и ту же схему).
        run: |
          PGPASSWORD=taskflow psql -h localhost -U taskflow -d taskflow -c "CREATE DATABASE taskflow_test OWNER taskflow;"
          PGPASSWORD=taskflow psql -h localhost -U taskflow -d taskflow -c "CREATE DATABASE taskflow_migrations_test OWNER taskflow;"

      - name: Ruff
        run: ruff check app tests scripts alembic

      - name: Black
        run: black --check app tests scripts

      - name: MyPy
        run: mypy app scripts

      - name: Pytest
        run: pytest

      - name: Alembic upgrade head (sanity check against a fresh database)
        run: alembic upgrade head

      - name: Seed script (idempotency smoke check)
        run: python -m scripts.seed && python -m scripts.seed

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    # Собираем образы только после того, как код прошёл lint/typecheck/test —
    # не тратим CI-минуты на сборку заведомо небитого кода.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t taskflow-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t taskflow-frontend:ci ./frontend

# Намеренно нет deployment-джобы — см. ТЗ Этапа 3. Деплой появится на Этапе 12.
