repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/(app|tests|scripts|alembic)/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/(app|tests|scripts)/

  # MyPy — через local hook, а не mirrors-mypy: mirror ставит mypy в
  # изолированное окружение, не видящее наши зависимости (fastapi, pydantic,
  # sqlalchemy), и без additional_dependencies сыплет ложные ошибки импорта.
  # Локальный venv из `make install` уже содержит всё нужное для честной
  # проверки типов.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c "cd backend && ./.venv/bin/mypy app scripts"
        language: system
        files: ^backend/(app|scripts)/.*\.py$
        pass_filenames: false
